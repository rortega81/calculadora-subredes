<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubnetViz Pro - Calculadora de Subredes</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS 4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX in browser (simplified for one file) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style type="text/css">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        }
        
        body {
            background-color: #0f172a;
            margin: 0;
            font-family: var(--font-sans);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .host-bit {
            background-color: rgba(71, 85, 105, 0.4);
            color: rgba(255, 255, 255, 0.4);
        }

        .network-bit {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Hide number input arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Network Logic Helpers ---
        const ipToInt = (ip) => {
            return ip.split('.').reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0;
        };

        const intToIp = (num) => {
            return [
                (num >>> 24) & 0xFF,
                (num >>> 16) & 0xFF,
                (num >>> 8) & 0xFF,
                num & 0xFF
            ].join('.');
        };

        const getBinaryOctets = (num) => {
            const binary = num.toString(2).padStart(32, '0');
            return [
                binary.slice(0, 8),
                binary.slice(8, 16),
                binary.slice(16, 24),
                binary.slice(24, 32)
            ];
        };

        // --- Custom Hook for Lucide Icons ---
        const useLucide = () => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });
        };

        const App = () => {
            const [ipInput, setIpInput] = useState("192.168.1.10");
            const [maskInput, setMaskInput] = useState(24);
            const [showChallenge, setShowChallenge] = useState(false);
            const [challenge, setChallenge] = useState(null);
            const [challengeGuess, setChallengeGuess] = useState("");
            const [challengeResult, setChallengeResult] = useState(null);

            useLucide();

            const results = useMemo(() => {
                try {
                    if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(ipInput)) return null;
                    const octets = ipInput.split('.').map(Number);
                    if (octets.some(o => o < 0 || o > 255)) return null;

                    const ipValue = ipToInt(ipInput);
                    const maskValue = (0xFFFFFFFF << (32 - maskInput)) >>> 0;
                    
                    const networkIdInt = (ipValue & maskValue) >>> 0;
                    const broadcastInt = (networkIdInt | (~maskValue)) >>> 0;
                    const totalHosts = Math.pow(2, 32 - maskInput) - 2;

                    return {
                        networkId: intToIp(networkIdInt),
                        broadcast: intToIp(broadcastInt),
                        firstHost: totalHosts > 0 ? intToIp(networkIdInt + 1) : "N/A",
                        lastHost: totalHosts > 0 ? intToIp(broadcastInt - 1) : "N/A",
                        totalHosts,
                        maskDecimal: intToIp(maskValue),
                        binaryOctets: getBinaryOctets(ipValue).map(octet => octet.split(''))
                    };
                } catch (e) {
                    return null;
                }
            }, [ipInput, maskInput]);

            const generateChallenge = () => {
                const masks = [24, 25, 26, 27, 28, 29, 30];
                const randomMask = masks[Math.floor(Math.random() * masks.length)];
                const hosts = Math.pow(2, 32 - randomMask) - 2;
                
                setChallenge({ 
                    targetHosts: hosts, 
                    correctMask: randomMask,
                    targetIp: `${Math.floor(Math.random() * 223) + 1}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.0`
                });
                setChallengeGuess("");
                setChallengeResult(null);
                setShowChallenge(true);
            };

            const checkChallenge = () => {
                if (parseInt(challengeGuess) === challenge?.correctMask) {
                    setChallengeResult("correct");
                } else {
                    setChallengeResult("wrong");
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-blue-500/30 relative">
                    {/* Artistic Background */}
                    <div className="fixed inset-0 bg-gradient-to-br from-indigo-900/40 via-slate-900 to-cyan-900/30 -z-0"></div>
                    <div className="fixed top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10 pointer-events-none"></div>

                    <div className="relative z-10 max-w-7xl mx-auto flex flex-col min-h-screen pb-12">
                        
                        {/* Header */}
                        <header className="px-6 md:px-8 pt-8 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/10 backdrop-blur-md sticky top-0 z-20">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-blue-600 rounded-2xl shadow-xl shadow-blue-600/20 ring-1 ring-white/20">
                                    <i data-lucide="network" className="text-white w-7 h-7"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                                        SubnetViz <span className="text-blue-400">Pro</span>
                                    </h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold mt-1 opacity-70">
                                        Calculadora Educativa de Ingeniería de Red
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex flex-col items-end mr-4">
                                    <span className="text-[9px] font-bold text-blue-400 uppercase tracking-widest leading-none mb-1">Status del Sistema</span>
                                    <div className="flex items-center gap-1.5 px-3 py-1 bg-white/5 rounded-full border border-white/10">
                                        <span className="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(74,222,128,0.6)]"></span>
                                        <span className="text-[10px] font-bold text-slate-300">NODO ACTIVO</span>
                                    </div>
                                </div>
                                <button 
                                    onClick={generateChallenge}
                                    className="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-bold transition-all shadow-2xl shadow-indigo-900/40 border border-white/10 active:scale-95 group"
                                >
                                    <i data-lucide="trophy" className="w-4 h-4 text-yellow-400 group-hover:rotate-12 transition-transform"></i>
                                    ZONA DE RETO
                                </button>
                            </div>
                        </header>

                        {/* Main Grid */}
                        <main className="flex-1 p-6 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* Left Column: Input & Theory */}
                            <div className="lg:col-span-4 space-y-6 flex flex-col">
                                <section className="glass-panel p-6 rounded-3xl shadow-2xl space-y-6 animate-fade-in">
                                    <h2 className="text-[11px] font-black text-slate-400 uppercase tracking-[3px] flex items-center gap-3">
                                        <i data-lucide="calculator" className="w-4 h-4 text-blue-400"></i>
                                        Configuración
                                    </h2>
                                    
                                    <div className="space-y-2.5">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Dirección IP (IPv4)</label>
                                        <input 
                                            type="text" 
                                            value={ipInput}
                                            onChange={(e) => setIpInput(e.target.value)}
                                            className="w-full bg-slate-950/40 border border-white/10 rounded-2xl px-5 py-4 text-xl font-mono text-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all shadow-inner"
                                            placeholder="192.168.0.1"
                                        />
                                    </div>

                                    <div className="space-y-2.5">
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Máscara (Prefijo CIDR)</label>
                                        <div className="relative">
                                            <select 
                                                value={maskInput}
                                                onChange={(e) => setMaskInput(parseInt(e.target.value))}
                                                className="w-full bg-slate-950/40 border border-white/10 rounded-2xl px-5 py-4 text-lg font-mono text-white appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500/50 shadow-inner"
                                            >
                                                {[24, 25, 26, 27, 28, 29, 30].map(m => (
                                                    <option key={m} value={m} className="bg-slate-900 text-white font-mono">
                                                        /{m} &nbsp; ({Math.pow(2, 32-m) - 2} hosts)
                                                    </option>
                                                ))}
                                            </select>
                                            <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                                                <i data-lucide="chevron-down" className="w-5 h-5"></i>
                                            </div>
                                        </div>
                                    </div>

                                    {!results && (
                                        <div className="flex items-center gap-2 text-red-400 text-[11px] font-bold px-2 py-2 bg-red-500/10 rounded-xl border border-red-500/20">
                                            <i data-lucide="alert-circle" className="w-4 h-4"></i>
                                            IP ERROR: FORMATO INVÁLIDO
                                        </div>
                                    )}
                                </section>

                                {/* Educational Section */}
                                <section className="backdrop-blur-xl bg-orange-600/10 border border-orange-500/20 rounded-3xl p-7 relative overflow-hidden flex-1 animate-fade-in [animation-delay:100ms]">
                                    <div className="absolute -right-6 -top-6 w-32 h-32 bg-orange-500/10 rounded-full blur-3xl opacity-50"></div>
                                    <h4 className="text-orange-300 text-[11px] font-black uppercase tracking-[3px] mb-4 italic">Concepto Clave</h4>
                                    <div className="space-y-4">
                                        <p className="text-sm text-slate-300 leading-relaxed font-medium">
                                            Para calcular los hosts restamos siempre <span className="text-orange-400 font-bold text-lg">2</span> direcciones especiales:
                                        </p>
                                        <div className="grid grid-cols-1 gap-3">
                                            <div className="flex items-start gap-4 p-4 bg-black/30 rounded-2xl border border-white/5 group hover:border-orange-500/20 transition-colors">
                                                <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400 mt-0.5">
                                                    <i data-lucide="grid-3x3" className="w-4 h-4"></i>
                                                </div>
                                                <div>
                                                    <span className="block text-white font-bold text-xs uppercase tracking-wider mb-1">Network ID</span>
                                                    <p className="text-[11px] text-slate-400 leading-snug">Identifica la red global. Todos los bits de host son <span className="text-slate-100 font-mono">0</span>.</p>
                                                </div>
                                            </div>
                                            <div className="flex items-start gap-4 p-4 bg-black/30 rounded-2xl border border-white/5 group hover:border-orange-500/20 transition-colors">
                                                <div className="bg-red-500/20 p-2 rounded-lg text-red-400 mt-0.5">
                                                    <i data-lucide="radio" className="w-4 h-4"></i>
                                                </div>
                                                <div>
                                                    <span className="block text-white font-bold text-xs uppercase tracking-wider mb-1">Broadcast IP</span>
                                                    <p className="text-[11px] text-slate-400 leading-snug">Canal de difusión para todos los equipos. Todos los bits son <span className="text-slate-100 font-mono">1</span>.</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="p-4 bg-white/5 rounded-2xl border border-white/5 flex items-center justify-between">
                                            <code className="text-sm font-mono font-bold text-white tracking-widest">2^n - 2</code>
                                            <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Fórmula Universal</span>
                                        </div>
                                    </div>
                                </section>
                            </div>

                            {/* Right Column: Binary & Details */}
                            <div className="lg:col-span-8 space-y-6">
                                
                                <section className="glass-panel p-8 rounded-3xl shadow-2xl animate-fade-in [animation-delay:200ms]">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
                                        <div>
                                            <h2 className="text-[11px] font-black text-slate-400 uppercase tracking-[3px] flex items-center gap-3">
                                                <i data-lucide="binary" className="w-5 h-5 text-indigo-400"></i>
                                                Visualización de Octetos
                                            </h2>
                                            <p className="text-slate-500 text-xs mt-1 font-medium italic">Cambia la máscara para ver cómo se 'roban' bits de host para la red.</p>
                                        </div>
                                        <div className="flex gap-6 text-[10px] font-black uppercase tracking-widest">
                                            <div className="flex items-center gap-2">
                                                <div className="w-4 h-4 bg-blue-500 rounded-md shadow-[0_0_10px_rgba(59,130,246,0.6)]"></div>
                                                <span className="text-blue-400">RED</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-4 h-4 bg-slate-600 rounded-md opacity-50"></div>
                                                <span className="text-slate-500">HOST</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        {results ? (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                                {results.binaryOctets.map((bits, octetIdx) => (
                                                    <div key={octetIdx} className="bg-slate-950/50 p-5 rounded-2xl border border-white/5 flex flex-col gap-4 group hover:ring-1 hover:ring-blue-500/20 transition-all duration-300">
                                                        <div className="flex justify-between items-center text-[10px] font-mono text-slate-600 border-b border-white/5 pb-2">
                                                            <span className="font-black uppercase tracking-widest">OCTETO {octetIdx + 1}</span>
                                                            <span className="text-blue-300 font-bold bg-blue-500/10 px-2 py-0.5 rounded-full text-xs">{ipInput.split('.')[octetIdx]}</span>
                                                        </div>
                                                        <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5 place-items-center">
                                                            {bits.map((bit, bitIdx) => {
                                                                const absoluteIdx = (octetIdx * 8) + bitIdx;
                                                                const isNetwork = absoluteIdx < maskInput;
                                                                return (
                                                                    <div
                                                                        key={bitIdx}
                                                                        className={`w-full aspect-square flex items-center justify-center rounded-lg font-mono font-black text-xs transition-all duration-500 ${isNetwork ? 'network-bit' : 'host-bit'}`}
                                                                    >
                                                                        {bit}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="h-64 flex flex-col items-center justify-center border-2 border-dashed border-white/10 bg-slate-950/20 rounded-3xl text-slate-500 italic gap-4">
                                                <div className="p-4 bg-slate-900 rounded-full ring-1 ring-white/10">
                                                    <i data-lucide="help-circle" className="w-8 h-8 opacity-30"></i>
                                                </div>
                                                <p className="text-sm font-medium tracking-wide">Esperando datos de entrada válidos...</p>
                                            </div>
                                        )}
                                    </div>
                                </section>

                                {results && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in [animation-delay:300ms]">
                                        
                                        {/* Result Column 1 */}
                                        <div className="backdrop-blur-xl bg-blue-600/10 border border-blue-500/20 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                                            <div className="flex justify-between items-start mb-6">
                                                <i data-lucide="shield" className="w-5 h-5 text-blue-400 opacity-50"></i>
                                                <span className="text-[10px] font-black text-blue-300/60 uppercase tracking-widest">ID DE SEGMENTO</span>
                                            </div>
                                            <div className="space-y-4">
                                                <div className="border-l-2 border-blue-500 pl-4 py-1">
                                                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mb-1">Network ID</span>
                                                    <p className="text-2xl font-mono text-white font-bold leading-none tracking-tighter">{results.networkId}</p>
                                                </div>
                                                <div className="border-l-2 border-red-500/50 pl-4 py-1">
                                                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mb-1">Broadcast IP</span>
                                                    <p className="text-lg font-mono text-slate-300 font-bold leading-none tracking-tighter opacity-80">{results.broadcast}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Result Column 2 */}
                                        <div className="backdrop-blur-xl bg-emerald-600/10 border border-emerald-500/20 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                                            <div className="flex justify-between items-start mb-6">
                                                <i data-lucide="users" className="w-5 h-5 text-emerald-400 opacity-50"></i>
                                                <span className="text-[10px] font-black text-emerald-300/60 uppercase tracking-widest">HOSTS USABLES</span>
                                            </div>
                                            <div className="space-y-4">
                                                <div className="border-l-2 border-emerald-500 pl-4 py-1">
                                                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mb-1">Rango del Segmento</span>
                                                    <p className="text-[13px] font-mono text-emerald-300 font-medium leading-relaxed tracking-tight">
                                                        {results.firstHost} <br/> 
                                                        <span className="text-slate-600 font-sans mx-2">→</span> <br/>
                                                        {results.lastHost}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Result Column 3 */}
                                        <div className="backdrop-blur-xl bg-indigo-600/10 border border-indigo-500/20 rounded-3xl p-6 shadow-xl overflow-hidden relative group transition-all hover:bg-indigo-600/20">
                                            <div className="absolute top-0 right-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity">
                                                <i data-lucide="cpu" className="w-16 h-16 text-indigo-400"></i>
                                            </div>
                                            <div className="relative z-10 flex flex-col h-full justify-between">
                                                <div className="flex justify-between items-start mb-4">
                                                    <i data-lucide="bar-chart-2" className="w-5 h-5 text-indigo-400 opacity-50"></i>
                                                    <span className="text-[10px] font-black text-indigo-300/60 uppercase tracking-widest">CAPACIDAD</span>
                                                </div>
                                                <div className="text-center md:text-left py-2">
                                                    <p className="text-5xl font-black text-white leading-none tracking-tighter mb-2">{results.totalHosts}</p>
                                                    <div className="bg-indigo-600 text-white rounded-lg inline-block px-3 py-1 font-mono text-[10px] font-black shadow-lg">
                                                        2^{32-maskInput} - 2
                                                    </div>
                                                </div>
                                                <div className="mt-4 pt-4 border-t border-white/5">
                                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Subnet Mask Full</span>
                                                    <span className="text-xs font-mono text-indigo-300 font-bold">{results.maskDecimal}</span>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                )}
                            </div>
                        </main>

                        {/* Footer Decoration */}
                        <div className="px-8 mt-12">
                            <div className="glass-panel rounded-full p-4 flex flex-col md:flex-row items-center justify-between gap-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                                <div className="flex items-center gap-2">
                                    <span className="px-2 py-1 bg-slate-800 rounded font-black text-slate-300">PROTOCOLO IPv4</span>
                                    <span>Laboratorio v1.2 &bull; CIFP Ferrolterra</span>
                                </div>
                                <div className="hidden md:flex gap-8">
                                    <span className="hover:text-blue-400 transition-colors cursor-help">Binary-AND Logic</span>
                                    <span className="hover:text-blue-400 transition-colors cursor-help">CIDR RFC-4632</span>
                                    <span className="hover:text-blue-400 transition-colors cursor-help">Subnet Masking</span>
                                </div>
                                <div className="text-slate-600">
                                    © 2026 Academia de Redes
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Challenge Modal Overlay */}
                    {showChallenge && challenge && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div 
                                className="absolute inset-0 bg-slate-950/80 backdrop-blur-2xl"
                                onClick={() => setShowChallenge(false)}
                            ></div>
                            
                            <div className="relative z-10 glass-panel border-white/20 bg-slate-900/60 rounded-[2.5rem] p-10 max-w-md w-full shadow-[0_0_80px_rgba(30,58,138,0.4)] space-y-8 overflow-hidden transform animate-fade-in">
                                <div className="absolute -right-20 -top-20 w-56 h-56 bg-blue-500/20 rounded-full blur-[100px]"></div>
                                
                                <div className="flex justify-between items-start relative z-10">
                                    <div className="bg-indigo-600/30 border border-indigo-500/30 p-4 rounded-3xl shadow-[inset_0_0_20px_rgba(255,255,255,0.05)]">
                                        <i data-lucide="swords" className="w-10 h-10 text-yellow-500 drop-shadow-[0_0_5px_rgba(234,179,8,0.4)]"></i>
                                    </div>
                                    <button 
                                        onClick={() => setShowChallenge(false)}
                                        className="p-3 hover:bg-white/5 rounded-full transition-all text-slate-500 hover:text-white"
                                    >
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                <div className="space-y-4 relative z-10">
                                    <h3 className="text-3xl font-black text-white tracking-tighter">Reto de Ingeniería</h3>
                                    <div className="bg-slate-950/60 rounded-3xl p-6 border border-white/5 space-y-5 shadow-inner">
                                        <div className="text-center space-y-1">
                                            <span className="text-[10px] uppercase text-slate-600 block tracking-[3px] font-black">Escenario Objetivo</span>
                                            <span className="text-xl font-mono text-blue-400 tracking-tighter block font-bold leading-none">{challenge.targetIp}</span>
                                        </div>
                                        <div className="py-4 px-5 bg-white/5 rounded-2xl border border-white/5 text-center">
                                            <p className="text-sm text-slate-300 leading-snug">
                                                Para dar soporte a un equipo de exactamente <br/>
                                                <span className="text-2xl font-black text-yellow-500 block my-1">{challenge.targetHosts} HOSTS</span>
                                                <span className="text-[10px] uppercase text-slate-500 tracking-widest font-bold">Sin desperdiciar bits</span>
                                            </p>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <p className="text-lg font-bold text-center text-white">¿Cuál es la máscara CIDR?</p>
                                    </div>
                                </div>

                                <div className="space-y-5 relative z-10">
                                    <div className="flex items-center gap-3">
                                        <div className="relative flex-1 group">
                                            <span className="absolute left-6 top-1/2 -translate-y-1/2 text-slate-500 font-mono text-2xl group-focus-within:text-blue-500 transition-colors">/</span>
                                            <input 
                                                type="number"
                                                value={challengeGuess}
                                                onChange={(e) => setChallengeGuess(e.target.value)}
                                                className="w-full pl-12 pr-6 py-5 bg-black/40 border-2 border-white/5 rounded-2xl outline-none focus:border-blue-500/50 font-mono text-3xl text-white shadow-inner transition-all"
                                                placeholder="24"
                                                autoFocus
                                            />
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={checkChallenge}
                                        className="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black shadow-[0_15px_30px_rgba(30,58,138,0.5)] transition-all flex items-center justify-center gap-3 border-t border-white/20 active:translate-y-1"
                                    >
                                        VERIFICAR RESPUESTA
                                        <i data-lucide="send" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                {challengeResult && (
                                    <div className={`p-5 rounded-2xl flex items-center gap-4 font-bold text-sm transition-all transform animate-fade-in ${
                                        challengeResult === "correct" 
                                            ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30" 
                                            : "bg-red-500/20 text-red-300 border border-red-500/30"
                                    }`}>
                                        <div className={`p-2 rounded-lg ${challengeResult === "correct" ? 'bg-emerald-500' : 'bg-red-500'} text-slate-900`}>
                                            <i data-lucide={challengeResult === "correct" ? "check" : "x"} className="w-4 h-4"></i>
                                        </div>
                                        <p>
                                            {challengeResult === "correct" 
                                                ? "¡Felicidades! Diagnóstico correcto. Máscara aplicada." 
                                                : "Error de cálculo. Pista: busca el primer 2^n mayor que host+2."}
                                        </p>
                                    </div>
                                )}
                                
                                <button 
                                    onClick={() => setShowChallenge(false)}
                                    className="w-full text-center text-slate-500 text-xs hover:text-slate-300 font-black tracking-widest py-2 transition-colors uppercase"
                                >
                                    Cerrar Laboratorio
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
